# Kustomize 基础配置：聚合所有 K8s 清单
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: psycheflow

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - hpa.yaml
  - ingress.yaml

images:
  - name: psycheflow-backend
    newName: ghcr.io/gunaie/psycheflow/backend
    newTag: latest
  - name: psycheflow-frontend
    newName: ghcr.io/gunaie/psycheflow/frontend
    newTag: latest
