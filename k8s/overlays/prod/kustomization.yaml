# 生产环境覆盖：使用推送的版本标签
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: psycheflow

resources:
  - ../../

images:
  - name: ghcr.io/gunaie/psycheflow/backend
    newTag: latest
  - name: ghcr.io/gunaie/psycheflow/frontend
    newTag: latest

# 生产环境强制镜像拉取策略
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
      name: psycheflow-backend
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
      name: psycheflow-frontend
