apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: psycheflow-backend-hpa
  namespace: psycheflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: psycheflow-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: psycheflow-frontend-hpa
  namespace: psycheflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: psycheflow-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
