apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: psycheflow-data
  namespace: psycheflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: psycheflow-logs
  namespace: psycheflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
