apiVersion: v1
kind: Secret
metadata:
  name: psycheflow-secrets
  namespace: psycheflow
type: Opaque
stringData:
  # 敏感配置（生产环境通过 sealed-secrets / external-secrets 管理）
  DATABASE_URL: "postgresql+asyncpg://psycheflow:CHANGE_ME@postgres:5432/psycheflow"
  DASHSCOPE_API_KEY: "CHANGE_ME"
  ADMIN_TOKEN: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
