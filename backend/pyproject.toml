[project]
name = "psycheflow-backend"
version = "0.1.0"
description = "PsycheFlow 智能心理评估系统后端（青少年校园心理筛查）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    # 数据校验与配置
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # 数据库
    "sqlalchemy>=2.0.35",
    # 百炼 LLM（OpenAI 兼容协议）
    "openai>=1.50.0",
    # Agent 编排
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    # 向量库
    "chromadb>=0.5.0",
    # 报告 PDF
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "markdown>=3.7",
    # 语音（D3 四期：ASR/TTS 均走 DashScope 原生 HTTP API，httpx 直连，无需 SDK）
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
