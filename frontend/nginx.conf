# ---------- HTTP → HTTPS 强制跳转（未成年人数据传输层加固） ----------
server {
    listen 80;
    server_name _;
    # 全站强制 HTTPS；仅保留 80 用于跳转，不服务任何内容
    return 301 https://$host$request_uri;
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书：由 docker-compose.prod.yml 把 ./certs 挂载到 /etc/nginx/certs
    # 开发/内网用自签证书（生成命令见 HANDOVER §3），生产替换为 Let's Encrypt/真实证书
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 安全头（未成年人合规） ----------
    # HSTS：仅 HTTPS 下生效，强制浏览器后续 2 年走 HTTPS + 预载
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
    # CSP：同源为主，blob/data 放行语音与图片
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'" always;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源缓存（带 hash 的文件长期缓存） ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # location 级 add_header 覆盖 server 级，安全头须重复
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'" always;
    }

    # ---------- API 反代到后端 ----------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应支持（SSE / LLM 流式输出）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        # 文件上传大小（语音录音等）
        client_max_body_size 10m;
    }
}
