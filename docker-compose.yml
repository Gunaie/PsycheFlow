services:
  # ---------- 向量库 ----------
  chroma:
    image: chromadb/chroma:latest
    container_name: psycheflow-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ---------- 后端 ----------
  backend:
    build: ./backend
    container_name: psycheflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 代码热重载
      - ./backend:/app
      # 保留构建时装好的 .venv，避免被宿主机空目录覆盖导致每次重装依赖
      - /app/.venv
      # 数据持久化（SQLite + 报告产物）
      - ./data:/app/data
      # 审计日志
      - ./logs:/app/logs
    environment:
      # volume 跨文件系统，关闭 hardlink 警告
      - UV_LINK_MODE=copy
      # PyPI 走阿里云源（镜像 ENV 里的清华源曾对本机 IP 限流 403）
      - UV_DEFAULT_INDEX=https://mirrors.aliyun.com/pypi/simple/
    env_file:
      - .env
    depends_on:
      - chroma
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------- Ollama 本地兜底模型（五期灾备） ----------
  # 首次需导入模型（一次性，blob 落 ./data/ollama 持久化）：
  #   docker cp <gguf> psycheflow-ollama:/tmp/qwen.gguf
  #   docker exec psycheflow-ollama sh -c 'printf "FROM /tmp/qwen.gguf\n" > /tmp/Modelfile && ollama create qwen2.5:7b -f /tmp/Modelfile'
  # 宿主机访问 http://localhost:11434；后端容器经 compose 网络访问 http://ollama:11434/v1
  ollama:
    image: ollama/ollama:latest
    container_name: psycheflow-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # GPU 直通（Docker Desktop WSL2 + NVIDIA 驱动；CPU 兜底也可跑但 7B 慢）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------- 前端 ----------
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: psycheflow-frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
