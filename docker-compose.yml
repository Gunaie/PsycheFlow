services:
  # ---------- 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: psycheflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=psycheflow
      - POSTGRES_PASSWORD=psycheflow
      - POSTGRES_DB=psycheflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psycheflow -d psycheflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- 向量库 ----------
  chroma:
    image: chromadb/chroma:latest
    container_name: psycheflow-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ---------- 后端 ----------
  backend:
    build: ./backend
    container_name: psycheflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 代码热重载
      - ./backend:/app
      # 保留构建时装好的 .venv，避免被宿主机空目录覆盖导致每次重装依赖
      - /app/.venv
      # 数据持久化（SQLite + 报告产物）
      - ./data:/app/data
      # 审计日志
      - ./logs:/app/logs
      # 本地语音模型挂载（通过 .env HOST_MODELS_PATH 配置，默认回退到 data/models）
      - ${HOST_MODELS_PATH:-./data/models}:/models/voice
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # volume 跨文件系统，关闭 hardlink 警告
      - UV_LINK_MODE=copy
      # PyPI 走阿里云源（镜像 ENV 里的清华源曾对本机 IP 限流 403）
      - UV_DEFAULT_INDEX=https://mirrors.aliyun.com/pypi/simple/
    env_file:
      - .env
    depends_on:
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------- Ollama 本地兜底（整机共享，不在本项目 compose 内） ----------
  # Ollama 作为宿主级共享服务独立运行（多项目共用一份模型库），不在本 compose 内：
  #   docker run -d --name ollama --gpus all -p 11434:11434 -v E:/OllamaModels:/root/.ollama -e OLLAMA_KEEP_ALIVE=-1 -e OLLAMA_KV_CACHE_TYPE=q8_0 --restart always ollama/ollama:latest
  #   - OLLAMA_KV_CACHE_TYPE=q8_0：KV cache 量化为 int8，显存占用减半（7B/32K 从 12.8GB→6.4GB；配合 num_ctx 缩小后可完全装入 8GB 显存）
  # 图形界面 Open WebUI：docker run -d -p 3001:8080 -e OLLAMA_BASE_URL=http://host.docker.internal:11434 -v open-webui:/app/backend/data --name open-webui --restart always ghcr.io/open-webui/open-webui:main
  # 后端容器经 .env OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 访问（见 .env.example）

  # ---------- 前端 ----------
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: psycheflow-frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    command: npm run dev -- --host 0.0.0.0

  # ---------- 监控栈 ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: psycheflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.4.0
    container_name: psycheflow-grafana
    restart: unless-stopped
    ports:
      - "3300:3000"   # 宿主机 2932-3131 属 Windows 保留段，改 3300
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/alerts:/etc/grafana/provisioning/alerting
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus

volumes:
  grafana-data:
